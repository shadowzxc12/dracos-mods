plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.nucleoid.xyz' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Burger Economy (stiahnute v CI do libs/) - len na kompilaciu, na serveri uz je
    modCompileOnly files("libs/burger-economy-1.0.0.jar")
    // Polymer (polymer-bundled is on the server) - only for sell-value tooltips
    modCompileOnly "eu.pb4:polymer-core:0.15.2+1.21.11"
    // Polydex (on the server) - custom item recipes show up in /polydex
    modCompileOnly "maven.modrinth:polydex:1.8.1+1.21.11"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
