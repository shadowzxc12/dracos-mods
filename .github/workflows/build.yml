name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Download Burger Economy (compile only)
        run: |
          mkdir -p libs
          curl -sSL -o libs/burger-economy-1.0.0.jar https://cdn.modrinth.com/data/kRqHzKDJ/versions/QuySk81K/burger-economy-1.0.0.jar
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dracos-core
          path: build/libs/*.jar
      - name: Debug - permission API names
        if: always()
        run: |
          J=""
          for j in $(find ~/.gradle/caches/fabric-loom .gradle -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/server/command/ServerCommandSource.class"; then J="$j"; break; fi
          done
          echo "JAR=$J"
          javap -cp "$J" net.minecraft.server.command.ServerCommandSource | grep -i -E "perm|level|op" || true
          echo ---CM
          javap -cp "$J" net.minecraft.server.command.CommandManager | grep -i -E "perm|level|check|require" || true
          echo ---PERM
          unzip -l "$J" | grep -i -E "command/permission|/permission/" | head -30 || true
