name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Download Burger Economy (compile only)
        run: |
          mkdir -p libs
          curl -sSL -o libs/burger-economy-1.0.0.jar https://cdn.modrinth.com/data/kRqHzKDJ/versions/QuySk81K/burger-economy-1.0.0.jar
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dracos-core
          path: build/libs/*.jar
      - name: Extract vanilla reference assets
        run: |
          V=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[]|select(.id=="1.21.11")|.url')
          C=$(curl -s "$V" | jq -r .downloads.client.url)
          curl -sSL -o /tmp/client.jar "$C"
          mkdir -p /tmp/ref && cd /tmp/ref
          unzip -q -o /tmp/client.jar 'assets/minecraft/textures/item/bow*' 'assets/minecraft/textures/item/netherite_*' 'assets/minecraft/textures/item/mace.png' 'assets/minecraft/textures/item/trident.png' 'assets/minecraft/textures/item/elytra.png' 'assets/minecraft/textures/item/golden_*' 'assets/minecraft/textures/item/diamond_*' 'assets/minecraft/textures/entity/equipment/humanoid/*' 'assets/minecraft/textures/entity/equipment/humanoid_leggings/*' 'assets/minecraft/items/bow.json' 'assets/minecraft/items/mace.json' 'assets/minecraft/items/netherite_sword.json' 'assets/minecraft/models/item/bow*.json' 'assets/minecraft/models/item/mace*.json' 'assets/minecraft/models/item/handheld*.json' 'assets/minecraft/equipment/netherite.json' || true
          unzip -p /tmp/client.jar version.json > version.json
          find . -type f | sort
      - name: Build & upload resource pack
        run: |
          pip install --quiet pillow numpy scipy
          PYTHONHASHSEED=1 python3 pack/gen.py /tmp/ref /tmp/pack
          # textures/models of the Polymer mods on the server (backpacks, polydex, polymer) - otherwise they show as purple cubes
          mkdir -p /tmp/modjars /tmp/modassets
          for U in https://cdn.modrinth.com/data/E7IsBILg/versions/tcS28Qp7/serverbackpacks-1.5.5%2B1.21.11.jar \
                   https://cdn.modrinth.com/data/m5NB7FJE/versions/N2p8L9kI/polydex-1.8.1%2B1.21.11.jar \
                   https://cdn.modrinth.com/data/xGdtZczs/versions/wugBT1fU/polymer-bundled-0.15.2%2B1.21.11.jar; do
            curl -sSL -o "/tmp/modjars/$(basename "$U" | sed 's/%2B/+/g')" "$U" || echo "download failed $U"
          done
          cd /tmp/modjars
          for j in *.jar; do unzip -q -o "$j" 'META-INF/jars/*' -d /tmp/modjars/nested_$j 2>/dev/null || true; done
          for j in $(find /tmp/modjars -name '*.jar'); do unzip -q -o "$j" 'assets/*' -x 'assets/minecraft/*' -d /tmp/modassets 2>/dev/null || true; done
          if [ -d /tmp/modassets/assets ]; then cp -rn /tmp/modassets/assets/* /tmp/pack/assets/ ; fi
          # 1.21.4+ needs an items/<id>.json per item model - add missing ones
          python3 - <<'PY'
          import os, json, glob
          for f in glob.glob('/tmp/pack/assets/*/models/item/**/*.json', recursive=True):
              ns = f.split('/assets/')[1].split('/')[0]
              if ns == 'minecraft':
                  continue
              rel = f.split('/models/item/')[1][:-5]
              out = f'/tmp/pack/assets/{ns}/items/{rel}.json'
              if not os.path.exists(out):
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  json.dump({"model": {"type": "minecraft:model", "model": f"{ns}:item/{rel}"}}, open(out, 'w'))
          PY
          ls /tmp/pack/assets
          cd -
          cd /tmp/pack && find . -exec touch -t 202601010000 {} + && zip -qrX9 /tmp/dracos-pack.zip pack.mcmeta pack.png assets
          SHA=$(sha1sum /tmp/dracos-pack.zip | cut -d' ' -f1)
          curl -sS -o /tmp/up.html -F "file=@/tmp/dracos-pack.zip" https://mc-packs.net/ || true
          URL=$(grep -oE 'https://download\.mc-packs\.net/pack/[A-Za-z0-9_.-]+\.zip' /tmp/up.html | head -1)
          echo "url=$URL" > /tmp/pack.txt; echo "sha1=$SHA" >> /tmp/pack.txt; cat /tmp/pack.txt
      - name: Publish jar to dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/dist && cp build/libs/*.jar /tmp/dist/
          cp -r /tmp/ref /tmp/dist/ref
          cp /tmp/pack.txt /tmp/up.html /tmp/dracos-pack.zip /tmp/dist/ || true
          cd /tmp/dist && git init -q -b dist
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" dist
