name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Download Burger Economy (compile only)
        run: |
          mkdir -p libs
          curl -sSL -o libs/burger-economy-1.0.0.jar https://cdn.modrinth.com/data/kRqHzKDJ/versions/QuySk81K/burger-economy-1.0.0.jar
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dracos-core
          path: build/libs/*.jar
      - name: Publish jar to dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/dist && cp build/libs/*.jar /tmp/dist/
          cd /tmp/dist && git init -q -b dist
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" dist
